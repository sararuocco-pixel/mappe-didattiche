;</strong>:","children":[{"content":"Caduta nel 1368 sotto gli attacchi dei Cinesi a est e dei Turchi a ovest","children":[],"payload":{"tag":"li","lines":"13,14"}},{"content":"La conversione all&apos;Isl&#xe0;m dei Mongoli dell&apos;Asia centrale contribuisce all&apos;espansione musulmana","children":[],"payload":{"tag":"li","lines":"14,15"}}],"payload":{"tag":"li","lines":"12,15"}},{"content":"<strong>Marco Polo e il <em>Milione</em></strong>:","children":[{"content":"Viaggio in Cina nel 1271 inviato con la famiglia Polo da Papa Gregorio per raggiungere il Gran Khan Kubil&#xe0;y","children":[],"payload":{"tag":"li","lines":"16,17"}},{"content":"Permanenza di 17 anni come consigliere del Khan","children":[],"payload":{"tag":"li","lines":"17,18"}},{"content":"Rientro in Italia (1295), prigionia a Genova e dettatura delle sue memorie a <strong>Rustichello da Pisa</strong> nel libro <em>Il Milione</em>","children":[],"payload":{"tag":"li","lines":"18,20"}}],"payload":{"tag":"li","lines":"15,20"}}],"payload":{"tag":"h2","lines":"4,5"}},{"content":"2. La Crisi del Trecento e la Peste Nera","children":[{"content":"<strong>Le cause della crisi (XIV secolo)</strong>:","children":[{"content":"Peggioramento del clima e raccolti distrutti","children":[],"payload":{"tag":"li","lines":"24,25"}},{"content":"Guerre continue e carestie ricorrenti","children":[],"payload":{"tag":"li","lines":"25,26"}},{"content":"Diffusione dell&apos;epidemia di <strong>peste nera</strong>","children":[],"payload":{"tag":"li","lines":"26,27"}}],"payload":{"tag":"li","lines":"23,27"}},{"content":"<strong>Diffusione e modalit&#xe0; di contagio</strong>:","children":[{"content":"Origine in Cina (1331) e spostamento rapido lungo la Via della Seta fino all&apos;Europa (1348)","children":[],"payload":{"tag":"li","lines":"28,29"}},{"content":"Focolaio permanente ai piedi dell&apos;Himalaya, attivato dal cambiamento climatico","children":[],"payload":{"tag":"li","lines":"29,30"}},{"content":"Vettore: bacillo trasmesso da <strong>pulci dei ratti</strong>, contatto diretto e droplets","children":[],"payload":{"tag":"li","lines":"30,31"}},{"content":"Sintomi: febbre alta, dolori e comparsa di <strong>bubboni</strong> ai linfonodi (peste bubbonica); morte in 2-3 giorni","children":[],"payload":{"tag":"li","lines":"31,32"}}],"payload":{"tag":"li","lines":"27,32"}},{"content":"<strong>Impatto sociale, culturale e conseguenze</strong>:","children":[{"content":"Ucciso un terzo della popolazione europea in soli quattro anni","children":[],"payload":{"tag":"li","lines":"33,34"}},{"content":"Diffusione di superstizioni e teorie errate (castigo divino, pianeti, aria corrotta)","children":[],"payload":{"tag":"li","lines":"34,35"}},{"content":"Abbandono dei malati e ricerca di capri espiatori (persecuzione degli Ebrei)","children":[],"payload":{"tag":"li","lines":"35,36"}},{"content":"<strong>Conseguenze storiche</strong>: calo demografico, crisi di fiducia nella Chiesa e nascita di una <strong>cultura laica e dinamica</strong> (preludio al Rinascimento)","children":[],"payload":{"tag":"li","lines":"36,38"}}],"payload":{"tag":"li","lines":"32,38"}}],"payload":{"tag":"h2","lines":"22,23"}},{"content":"3. L&#x2019;Italia delle Signorie e degli Stati Regionali","children":[{"content":"<strong>Transizione dai Comuni alle Signorie</strong>:","children":[{"content":"Instabilit&#xe0; comunale dovuta alle lotte tra Guelfi (Bianchi e Neri), Ghibellini e famiglie dei Magnati","children":[],"payload":{"tag":"li","lines":"42,43"}},{"content":"Affidamento del potere a singoli &quot;uomini forti&quot; che instaurano un potere assoluto su citt&#xe0; e contado","children":[],"payload":{"tag":"li","lines":"43,44"}},{"content":"Divisione della penisola: Italia centro-settentrionale (Signorie/Stati regionali), Stato della Chiesa (centro), Regno di Napoli (sud)","children":[],"payload":{"tag":"li","lines":"44,45"}}],"payload":{"tag":"li","lines":"41,45"}},{"content":"<strong>I principali Stati Regionali</strong>:","children":[{"content":"<strong>Milano</strong>: dominata dai Visconti e dal 1450 dagli Sforza. Grande sviluppo economico: navigli, riso, seta (gelsi) e marcite per l&apos;allevamento","children":[],"payload":{"tag":"li","lines":"46,47"}},{"content":"<strong>Venezia</strong>: Repubblica oligarchica guidata dal Maggior Consiglio e dal Doge. Conquista dell&apos;entroterra veneto-lombardo nella guerra contro Milano (conclusa con la <strong>Pace di Lodi</strong> nel 1454)","children":[],"payload":{"tag":"li","lines":"47,48"}},{"content":"<strong>Firenze</strong>: dominata dalla famiglia dei banchieri <strong>Medici</strong> dal 1434 con Cosimo il Vecchio e poi con Lorenzo il Magnifico (artefice della &quot;politica dell&apos;equilibrio&quot;)","children":[],"payload":{"tag":"li","lines":"48,49"}},{"content":"<strong>Piemonte</strong>: formazione dello Stato regionale sotto la dinastia dei <strong>Savoia</strong> grazie al controllo dei valichi alpini","children":[],"payload":{"tag":"li","lines":"49,50"}},{"content":"<strong>Napoli</strong>: passaggio dagli Angioini agli Aragonesi (1442), diventando Vicereame di Spagna con una politica basata sul latifondo che porta al declino economico","children":[],"payload":{"tag":"li","lines":"50,52"}}],"payload":{"tag":"li","lines":"45,52"}}],"payload":{"tag":"h2","lines":"40,41"}},{"content":"4. La Nascita delle Monarchie Nazionali","children":[{"content":"<strong>I pilastri del potere monarchico</strong>:","children":[{"content":"Declino dei poteri universali (Impero e Papato) nel Trecento","children":[],"payload":{"tag":"li","lines":"56,57"}},{"content":"Requisiti di controllo del re: feudi superiori ai signori, esercito permanente, funzionari statali, afflusso regolare di tasse","children":[],"payload":{"tag":"li","lines":"57,58"}}],"payload":{"tag":"li","lines":"55,58"}},{"content":"<strong>Francia</strong>:","children":[{"content":"Filippo IV il Bello istituisce gli <strong>Stati Generali</strong>","children":[],"payload":{"tag":"li","lines":"59,60"}},{"content":"Scontro con Papa Bonifacio VIII, schiaffo di Anagni e inizio della <strong>Cattivit&#xe0; avignonese</strong> (1309-1377) seguita dallo <strong>Scisma d&apos;Occidente</strong> (1378-1417)","children":[],"payload":{"tag":"li","lines":"60,61"}}],"payload":{"tag":"li","lines":"58,61"}},{"content":"<strong>Inghilterra</strong>:","children":[{"content":"Sconfitta a Bouvines (1214) e concessione della <strong>Magna Charta Libertatum</strong> al clero e all&apos;aristocrazia","children":[],"payload":{"tag":"li","lines":"62,63"}},{"content":"Strutturazione del <strong>Parlamento inglese</strong> diviso in Camera dei Lord e Camera dei Comuni","children":[],"payload":{"tag":"li","lines":"63,64"}}],"payload":{"tag":"li","lines":"61,64"}},{"content":"<strong>I grandi conflitti europei</strong>:","children":[{"content":"<strong>Guerra dei Cent&apos;anni (1337-1453)</strong>: scontro tra Francia e Inghilterra; vittoria francese facilitata dalla figura di <strong>Giovanna d&apos;Arco</strong>","children":[],"payload":{"tag":"li","lines":"65,66"}},{"content":"<strong>Guerra delle Due Rose</strong>: guerra civile inglese tra York e Lancaster, conclusa nel 1485 con l&apos;ascesa di <strong>Enrico VII Tudor</strong>","children":[],"payload":{"tag":"li","lines":"66,67"}}],"payload":{"tag":"li","lines":"64,67"}},{"content":"<strong>Spagna</strong>:","children":[{"content":"Avanzamento della <em>Reconquista</em> contro gli Arabi","children":[],"payload":{"tag":"li","lines":"68,69"}},{"content":"Nascita del Regno di Spagna nel 1469 con il matrimonio tra <strong>Isabella di Castiglia</strong> e <strong>Ferdinando d&apos;Aragona</strong>","children":[],"payload":{"tag":"li","lines":"69,70"}},{"content":"Politica di accentramento accentuata dal Tribunale dell&apos;Inquisizione ed espulsione/conversione forzata di Ebrei e Arabi (<em>Limpieza de Sangre</em>)","children":[],"payload":{"tag":"li","lines":"70,71"}}],"payload":{"tag":"li","lines":"67,71"}}],"payload":{"tag":"h2","lines":"54,55"}}],"payload":{"tag":"h1","lines":"0,1"}},null)</script>
